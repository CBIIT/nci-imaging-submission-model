PropDefinitions:
  acknowledgements:
    Term:
    - Value: Research Activity Acknowledgements Text
      Origin: caDSR
      Definition: Systematic investigation into a subject in order to discover facts,
        establish or revise a theory, or develop a plan of action based on the facts
        discovered.:A branch of knowledge.:The words of something written.
      Version: '1'
      Code: '17284354'
    Desc: additional acknowledgments
    Req: 'No'
    Type: string
  adult_or_childhood_study:
    Term:
    - Value: Study Administration Legal Adult Or Pediatric Study Type
      Origin: caDSR
      Definition: The identifiable class of the study participants based upon their
        age.
      Version: '3'
      Code: '11524549'
    Desc: Study participants are adult, pediatric, or other
    Req: 'No'
    Type: string
  dataset_abstract:
    Term:
    - Value: Study Administration Dataset Abstract Text
      Origin: caDSR
      Definition: A written summary of the important points of a collection of related
        data records.
      Version: '1'
      Code: '17279144'
    Desc: Short description that will identify the dataset on public pages
    Req: 'Yes'
    Type: string
  dataset_description:
    Term:
    - Value: Study Administration Dataset Description Text
      Origin: caDSR
      Definition: A written explanation of a collection of related data records.
      Version: '1'
      Code: '17279143'
    Desc: Description of the collection / dataset / study
    Req: 'Yes'
    Type: string
  dataset_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Req: 'Yes'
    Key: 'True'
    Type: string
  dataset_long_name:
    Term:
    - Value: Study Administration Dataset Name Text
      Origin: caDSR
      Definition: Words that describe a collection of related data records.
      Version: '1'
      Code: '17279141'
    Desc: descriptive title for the collection/ dataset
    Req: 'Yes'
    Type: string
  dataset_short_name:
    Term:
    - Value: Study Administration Dataset Short Name Text
      Origin: caDSR
      Definition: The acronym or abbreviated form of the name of a collection of related
        data records.
      Version: '1'
      Code: '17279142'
    Desc: abbreviated title for the collection/ dataset
    Req: 'Yes'
    Type: string
  funding_agency:
    Term:
    - Value: Study Administration Funding Agency Organization Name
      Origin: caDSR
      Definition: The name of the funding source organization or sponsor.
      Version: '1'
      Code: '16002760'
    Desc: Funding agency of the requestor study
    Req: 'No'
    Type: string
  funding_source_program_name:
    Term:
    - Value: Study Administration Funding Agency Program Name
      Origin: caDSR
      Definition: The name of the program assigned by the funding agency.
      Version: '1'
      Code: '16002776'
    Desc: The funding source organization/sponsor
    Req: 'No'
    Type: string
  grant_id:
    Term:
    - Value: Study Administration Grant Funding Number Identifier
      Origin: caDSR
      Definition: One or more characters used to identify a grant.
      Version: '1'
      Code: '16002823'
    Desc: Grant or contract identifier
    Req: 'No'
    Type: string
  age_at_diagnosis:
    Term:
    - Value: Subject Age in Days at Diagnosis Count
      Origin: caDSR
      Definition: The age in days of the subject at the time of diagnosis.
      Version: '1'
      Code: '15019300'
    Desc: Age at the time of diagnosis expressed in number of days since birth.
    Req: 'Yes'
    Type: string
  diagnosis_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Req: 'Yes'
    Key: 'True'
    Type: string
  metastasis_anatomic_site:
    Term:
    - Value: Disease Metastasis Anatomic Site Uberon Identifier
      Origin: caDSR
      Definition: The location within the body where cancer has spread from one part
        of the body (the organ in which it first appeared) to another secondary part
        as captured in the Uberon identifier.
      Version: '1'
      Code: '15114457'
    Req: 'No'
    Type: string
  primary_diagnosis:
    Term:
    - Value: Disease Primary Diagnosis NCI Thesaurus Text
      Origin: caDSR
      Definition: A term describing the main condition for evaluation and treatment
        as captured in the Disease or Diagnosis (C2991) branch of the National Cancer
        Institute Thesaurus (NCIt) hierarchy tree.
      Version: '1'
      Code: '14905532'
    Desc: A term describing the main condition for evaluation and treatment as captured
      in the Disease or Diagnosis (C2991) branch of the National Cancer Institute
      Thesaurus (NCIt) hierarchy tree.
    Req: 'Yes'
    Type: string
  primary_site:
    Term:
    - Value: Disease Primary Site Uberon Identifier
      Origin: caDSR
      Definition: The location within the body from where the disease of interest
        originated as captured in the Uberon identifier.
      Version: '1'
      Code: '14883047'
    Desc: The location within the body from where the disease of interest originated
      as captured in the Uberon identifier.
    Req: 'Yes'
    Type: string
  data_has_been_de_identified:
    Term:
    - Value: Data File Deidentified Indicator
      Origin: caDSR
      Definition: A data file stored as an electronic record.:Removal of text elements
        that would make data individually identifiable.:An event, entity or condition
        that typically characterizes a prescribed environment or situation and determines
        or aids in determining whether certain stated circumstances exist or criteria
        are satisfied.
      Version: '1'
      Code: '17087977'
    Desc: Flag
    Req: 'Yes'
    Type: string
  de_identification_method_description:
    Term:
    - Value: Deidentification Method Description Text
      Origin: caDSR
      Definition: Text describing the manner of procedure or systematic course of
        actions performed to remove text elements that would make data individually
        identifiable.
      Version: '1'
      Code: '14612655'
    Desc: Description of the process of removing potentially identifying data or data
      elements to render data into a form that does not identify individuals and where
      identification is not likely to take place.
    Req: 'No'
    Type: string
  de_identification_method_type:
    Term:
    - Value: Data File Deidentification Method Type
      Origin: caDSR
      Definition: The type of procedure used to remove text elements that would make
        data individually identifiable in an electronic record.
      Version: '1'
      Code: '14576319'
    Desc: General description of the de-identification method
    Req: 'No'
    Type: string
  de_identification_software:
    Term:
    - Value: Deidentification Software Name Text
      Origin: caDSR
      Definition: Text describing the literal identifier of the software program used
        to remove text elements that would make data individually identifiable.
      Version: '1'
      Code: '14612658'
    Desc: Software that was used to de-identify the images (if used)
    Req: 'No'
    Type: string
  file_description:
    Term:
    - Value: Data File Description Text
      Origin: caDSR
      Definition: A free text field that can be used to document the content and other
        details about a data file that may not be captured elsewhere.
      Version: '2'
      Code: '11280338'
    Desc: Human-readable description of file
    Req: 'No'
    Type: string
  file_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Desc: A file identifier generated by CRDC Submission Portal. This property is
      not included in the downloaded submission template
    Req: 'Yes'
    Key: 'True'
    Type: string
  file_name:
    Term:
    - Value: Data File Name Text
      Origin: caDSR
      Definition: The literal label for an electronic data file.
      Version: '3'
      Code: '11284037'
    Desc: Name of file
    Req: 'Yes'
    Type: string
  file_size:
    Term:
    - Value: Data File Size Integer
      Origin: caDSR
      Definition: The measure (in bytes) of how much space a data file takes up on
        a storage medium.
      Version: '2'
      Code: '11479876'
    Desc: File size in bytes
    Req: 'No'
    Type: string
  file_type:
    Term:
    - Value: Data File Format Type
      Origin: caDSR
      Definition: A defined organization or layout representing and structuring data
        in a computer file.
      Version: '2'
      Code: '11416926'
    Desc: File type from enumerated list
    Req: 'Yes'
    Type: string
  license:
    Term:
    - Value: Data File Dataset License Type
      Origin: caDSR
      Definition: The license format describing credit and use restrictions when granting
        permission to share and/or distribute data collections.
      Version: '1'
      Code: '14902606'
    Desc: license under which this collection / dataset / study will be published;
      Official or legal permission to do or own a specified thing.
    Req: 'Yes'
    Type: string
  md5sum:
    Term:
    - Value: Data File MD5 Checksum Text
      Origin: caDSR
      Definition: A 32-character hexadecimal number that is computed on a file.
      Version: '2'
      Code: '11556150'
    Desc: MD5 hex digest for this file
    Req: 'Yes'
    Type: string
  acquisition_method_type:
    Term:
    - Value: Biospecimen Acquisition Method Type
      Origin: caDSR
      Definition: Records the method of acquisition or source for the specimen under
        consideration.
      Version: '2'
      Code: '6626651'
    Desc: Records the method of acquisition or source for the specimen under consideration
    Req: 'No'
    Type: string
  embedding_medium:
    Term:
    - Value: Specimen Preservation Procedure Type
      Origin: caDSR
      Definition: The term which describes the method used to maintain the specimen
        in a viable state.
      Version: '3'
      Code: '8028962'
    Desc: The term which describes the medium used to maintain the specimen in a viable
      state.
    Req: 'Yes'
    Type: string
  histopathology_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Req: 'Yes'
    Key: 'True'
    Type: string
  immersion:
    Term:
    - Value: Imaging Procedure Microscope Immersion Medium Type
      Origin: caDSR
      Definition: Text specifying the kind of fluid used to fill the space between
        a microscope's objective lens and the coverslip.
      Version: '2'
      Code: '8058286'
    Desc: Immersion medium
    Req: 'No'
    Type: string
  lens_numerical_aperture:
    Term:
    - Value: Equipment Microscope Lens Numerical Aperture Float Value
      Origin: caDSR
      Definition: A floating point numerical value describing the range of angles
        over which the objective lens can accept or emit light.
      Version: '2'
      Code: '7788942'
    Desc: The numerical aperture of the lens. Floating point value > 0.
    Req: 'No'
    Type: string
  nominal_magnification:
    Term:
    - Value: Equipment Microscope Nominal Magnification Float Value
      Origin: caDSR
      Definition: A floating point numerical value describing the nominal magnification
        of an optical instrument using a combination of lenses to produce an image.
      Version: '2'
      Code: '7788940'
    Desc: The magnification of the lens as specified by the manufacturer - i.e. '60'
      is a 60X lens. floating point value > 1(no units)
    Req: 'No'
    Type: string
  objective:
    Term:
    - Value: Equipment Microscope Objective Lens Text
      Origin: caDSR
      Definition: Text which describes the microscope's objective lens nearest to
        the specimen being viewed that magnifies and projects the image of the specimen.
      Version: '2'
      Code: '7788935'
    Desc: An_objective_is an optical element that gathers light from an object being
      observed and_focuses_the_light rays_from it to produce a_real image_of the object.
    Req: 'No'
    Type: string
  staining_method:
    Term:
    - Value: Specimen Staining Method Type
      Origin: caDSR
      Definition: The type of method used to perform the staining.
      Version: '1'
      Code: '16964049'
    Desc: Any of the various methods that use a dye, reagent, or other material for
      producing coloration in tissues or microorganisms for microscopic examination.
    Req: 'Yes'
    Type: string
  tissue_fixative:
    Term:
    - Value: Specimen Preservation Procedure Medium Type
      Origin: caDSR
      Definition: The kind of substance holding another substance in solution or suspension
        to maintain a specimen in a viable state.
      Version: '1'
      Code: '16323957'
    Desc: A compound that preserves tissues and cells for microscopic study.
    Req: 'Yes'
    Type: string
  tumor_tissue_type:
    Term:
    - Value: Tumor Classification Category
      Origin: caDSR
      Definition: The classification of a tumor at a particular time based primarily
        on histopathological characteristics.
      Version: '1'
      Code: '12922545'
    Desc: Text that describes the kind of disease present in the tumor specimen as
      related to a specific timepoint (add rows to select multiple values along with
      timepoints)
    Req: 'No'
    Type: string
  author_order:
    Term:
    - Value: Publication Author Display Order Integer
      Origin: caDSR
      Definition: A printed or electronic work offered for distribution.:The writer
        of a book, article, or other text._The sequence or position of a component
        in a list.:A number with no fractional part, including the negative and positive
        numbers as well as zero.
      Version: '1'
      Code: '17090270'
    Desc: Indicates the order in which the authors of the dataset should be listed
    Req: 'No'
    Type: string
  email:
    Term:
    - Value: Person Email Address Text
      Origin: caDSR
      Definition: The string of characters that represents the electronic mail address
        of a person.
      Version: '1'
      Code: '2517550'
    Desc: The string of characters that represents the electronic mail address of
      a person.
    Req: 'No'
    Type: string
  first_name:
    Term:
    - Value: Person Given/First Name
      Origin: caDSR
      Definition: A word or group of words indicating a person's first (personal or
        given) name; the name that precedes the surname. Synonym = Given Name
      Version: '2'
      Code: '2179589'
    Desc: A word or group of words indicating a person's first (personal or given)
      name; the name that precedes the surname. Synonym = Given Name.> The first or
      given name of the person responsible for the conduct of the clinical trial or
      research project.
    Req: 'Yes'
    Type: string
  investigator_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Req: 'Yes'
    Key: 'True'
    Type: string
  last_name:
    Term:
    - Value: Person Family/Last Name
      Origin: caDSR
      Definition: A means of identifying an individual by using a word or group of
        words indicating a person's last (family) name. Synonym = Last Name, Surname.
      Version: '2'
      Code: '2179591'
    Desc: A means of identifying an individual by using a word or group of words indicating
      a person's last (family) name. Synonym = Last Name, Surname.> The last or family
      name of the person responsible for the conduct of the clinical trial or research
      project
    Req: 'Yes'
    Type: string
  middle_name:
    Term:
    - Value: Person Middle Name
      Origin: caDSR
      Definition: A means of identifying an individual by using a word or group of
        words indicating a person's middle name.
      Version: '2'
      Code: '2179590'
    Desc: A means of identifying an individual by using a word or group of words indicating
      a person's middle name.> The middle name of the person responsible for the conduct
      of the clinical trial or research project.
    Req: 'No'
    Type: string
  organization_name:
    Term:
    - Value: Research Activity Organization Name
      Origin: caDSR
      Definition: A textual identifier for an organization.
      Version: '1'
      Code: '17090221'
    Desc: 'Name of the organization for which the investigator works. '
    Req: 'No'
    Type: string
  person_orcid:
    Term:
    - Value: Person ORCID Text
      Origin: caDSR
      Definition: A persistent unique digital identifier assigned to a person by the
        Open Researcher and Contributor ID (ORCID) organization.
      Version: '3'
      Code: '10624734'
    Desc: A persistent unique digital identifier assigned to a person by the Open
      Researcher and Contributor ID (ORCID) organization.> A persistent unique digital
      identifier assigned to a principal investigator by the Open Researcher and Contributor
      ID (ORCID) organization.
    Req: 'Yes'
    Type: string
  role:
    Term:
    - Value: Person Affiliation Role Text Type
      Origin: caDSR
      Definition: The text that describes the distinguishable characteristics of the
        action or activity assigned to or required or expected of a person in a formal
        association with a group or organization.
      Version: '2'
      Code: '2201713'
    Desc: The text that describes the distinguishable characteristics of the action
      or activity assigned to.
    Req: 'No'
    Type: string
  ror_id:
    Term:
    - Value: Study Administration Research Organization Registry Identifier
      Origin: caDSR
      Definition: A Research Organization Registry ID (ROR ID) is a unique digital
        identifier created by the ROR used to identify research and funding organizations.
      Version: '1'
      Code: '17090260'
    Desc: The Research Organization Registry (ROR) is a global, community-led registry
      of open persistent identifiers for research organizations. (https://ror.org/)
    Req: 'No'
    Type: string
  antibody_name:
    Term:
    - Value: Assay Antibody Name
      Origin: caDSR
      Definition: Words that describe the name of the antibody.
      Version: '1'
      Code: '16964035'
    Desc: short descriptive name for this antibody
    Req: 'No'
    Type: string
  catalog_number:
    Term:
    - Value: Imaging Multiplexed Imaging Vendor Catalog Number Text
      Origin: caDSR
      Definition: A textual description of the catalog identifier assigned to a product
        by the vendor used in multiplex imaging.
      Version: '1'
      Code: '14767261'
    Desc: catalog number from vendor
    Req: 'No'
    Type: string
  channel_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Desc: The unique channel identifier for each channel in this image must match
      the corresponding field in the OME-TIFF header
    Req: 'Yes'
    Key: 'True'
    Type: string
  channel_name:
    Term:
    - Value: Imaging OME Tagged Image File Format Channel Name
      Origin: caDSR
      Definition: Any technology or method that aids in the visualization of any biological
        process, cell, tissue or organ for use in screening, diagnosis, surgical procedures
        or therapy.:A tagged image file format (TIFF) image file format that contains
        an Open Microscopy Environment (OME) XML metadata block in the file header
        for storing microscopy information (pixels and metadata) using the OME Data
        Model._An independent acquisition scheme, i.e., a route or conduit through
        which flows data consisting of one particular measurement using one particular
        parameter.:The words or language units by which a thing is known.
      Version: '1'
      Code: '14765172'
    Desc: Channel label for each channel in this image must match the corresponding
      field in the OME-TIFF header
    Req: 'Yes'
    Type: string
  clone:
    Term:
    - Value: Imaging Multiplex Imaging Clone Unique Identifier
      Origin: caDSR
      Definition: A sequence of characters used to identify a group of genetically
        identical cells, organisms, or DNA molecules used in multiplex imaging.
      Version: '1'
      Code: '14767258'
    Desc: Unique clone identifier
    Req: 'No'
    Type: string
  concentration:
    Term:
    - Value: Imaging Multiplex Imaging Final Concentration Number
      Origin: caDSR
      Definition: A numerical quantity which captures the measure of the amount of
        substance present in a unit amount of mixture used in multiplex imaging.
      Version: '1'
      Code: '14768386'
    Desc: Final concentration used in experiment
    Req: 'No'
    Type: string
  cycle_number:
    Term:
    - Value: Imaging Multiplex Imaging Reagent Cycle Number Integer
      Origin: caDSR
      Definition: A numerical value which captures the cycle number during which a
        reagent was used in multiplex imaging.
      Version: '1'
      Code: '14765176'
    Desc: 'the cycle # in which the co-listed reagent(s) was(were) used'
    Req: 'No'
    Type: string
  dilution:
    Term:
    - Value: Imaging Multiplex Imaging Final Dilution Ratio Number
      Origin: caDSR
      Definition: A numerical quantity which captures the concentration of  different
        reagents used in multiplex imaging.
      Version: '1'
      Code: '14767270'
    Desc: Final dilution ratio used in experiment
    Req: 'No'
    Type: string
  emission_bandwidth:
    Term:
    - Value: Imaging Multiplex Imaging Emission Bandwidth Number
      Origin: caDSR
      Definition: A numerical quantity which captures the nominal width of an emission
        spectrum used in multiplex imaging.
      Version: '1'
      Code: '14765193'
    Desc: nominal width of emission spectrum (nm)
    Req: 'No'
    Type: string
  emission_wavelength:
    Term:
    - Value: Imaging Multiplex Imaging Emission Wavelength Number
      Origin: caDSR
      Definition: A numerical quantity which captures the wavelength with the maximum
        peak in an emission spectrum.
      Version: '1'
      Code: '14767264'
    Desc: center/peak of the emission spectrum (nm)
    Req: 'No'
    Type: string
  excitation_bandwidth:
    Term:
    - Value: Imaging Multiplex Imaging Excitation Bandwidth Number
      Origin: caDSR
      Definition: A numerical quantity which captures the nominal width of an excitation
        spectrum used in multiplex imaging.
      Version: '1'
      Code: '14765190'
    Desc: nominal width of excitation spectrum (nm)
    Req: 'No'
    Type: string
  excitation_wavelength:
    Term:
    - Value: Imaging Multiplex Imaging Excitation Wavelength Number
      Origin: caDSR
      Definition: A numerical quantity which captures the electromagnetic radiation
        wavelength that causes peak excitation used in multiplex imaging.
      Version: '1'
      Code: '14765187'
    Desc: center/peak of the excitation spectrum (nm)
    Req: 'No'
    Type: string
  fluorophore:
    Term:
    - Value: Imaging Multiplex Imaging Fluorescent Dye Text
      Origin: caDSR
      Definition: A textual description of fluorescent antibodies, aptamers, peptides,
        dyes, and similar detection reagents used in multiplex imaging.
      Version: '1'
      Code: '14767255'
    Desc: Fluorescent dye label
    Req: 'No'
    Type: string
  lot:
    Term:
    - Value: Imaging Multiplex Imaging Vendor Lot Number Text
      Origin: caDSR
      Definition: A textual description of the lot identifier assigned to a product
        by the vendor used in multiplex imaging.
      Version: '1'
      Code: '14769695'
    Desc: lot number from vendor
    Req: 'No'
    Type: string
  metal_isotope_element:
    Term:
    - Value: Imaging Multiplexed Imaging Isotope Abbreviation Name
      Origin: caDSR
      Definition: The words by which the chemical element containing a specific number
        of neutrons and a specific atomic mass used in multiplex imaging is known.
      Version: '1'
      Code: '14765198'
    - Value: Imaging Multiplex Imaging Isotope Element Identifier
      Origin: caDSR
      Definition: A sequence of characters used to identify the chemical element used
        in multiplex imaging whose atoms all have the same atomic number.
      Version: '1'
      Code: '14765201'
    Desc: Element abbreviation
    Req: 'No'
    Type: string
  oligo_barcode_lower_strand:
    Term:
    - Value: Imaging Multiplex Imaging Oligonucleotide Barcode Lower Strand Text
      Origin: caDSR
      Definition: A textual description of the oligonucleotide barcode used in multiplex
        imaging to label the non-coding strand in double-stranded DNA.
      Version: '1'
      Code: '14765208'
    Desc: DNA barcode used for labeling
    Req: 'No'
    Type: string
  oligo_barcode_upper_strand:
    Term:
    - Value: Imaging Multiplex Imaging Oligonucleotide Barcode Upper Strand Text
      Origin: caDSR
      Definition: A textual description of the oligonucleotide barcode used in multiplex
        imaging to label the coding strand in double-stranded DNA.
      Version: '1'
      Code: '14765205'
    Desc: DNA barcode used for labeling
    Req: 'No'
    Type: string
  rrid_identifier:
    Term:
    - Value: Research Activity Resource Identifier
      Origin: caDSR
      Definition: A Research Resource Identifier (RRID) is a unique identifier for
        referencing a research resource such as organisms, antibodies, plasmids, cell
        lines, software tools and databases.
      Version: '1'
      Code: '14767247'
    Desc: Research Resource Identifier
    Req: 'No'
    Type: string
  sub_cycle_number:
    Term:
    - Value: Imaging Multiplex Imaging Reagent Sub-Cycle Number Integer
      Origin: caDSR
      Definition: A numerical value which captures the sub-cycle number during which
        a reagent was used in multiplex imaging.
      Version: '1'
      Code: '14765180'
    Desc: 'sub-cycle #'
    Req: 'No'
    Type: string
  target_name:
    Term:
    - Value: Imaging Multiplex Imaging Target Antigen Name
      Origin: caDSR
      Definition: The words by which the substance, generally a protein, that stimulates
        the immune system and elicits an immune response used in multiplex imaging
        is known.
      Version: '1'
      Code: '14765182'
    Desc: short descriptive name (abbreviation) for this target (antigen)
    Req: 'No'
    Type: string
  imaging_assay_type:
    Term:
    - Value: Assay Type
      Origin: caDSR
      Definition: The type of assay method or technology utilized to determine the
        amount of a particular constituent in a sample or the biological properties
        or activity of the sample.
      Version: '2'
      Code: '7789196'
    Desc: Type of imaging assay
    Req: 'Yes'
    Type: string
  multiplex_image_id:
    Term:
    - Value: Data Record Link Unique Identifier
      Origin: caDSR
      Definition: A unique sequence of characters used to identify a linkage between
        related records.
      Version: '1'
      Code: '14822135'
    Req: 'Yes'
    Key: 'True'
    Type: string
  pyramid:
    Term:
    - Value: Imaging Pyramid Representation True False Indicator
      Origin: caDSR
      Definition: A response of true or false or to indicate if an image is a multi-resolution
        representation allowing for analysis and manipulation of the image over a
        range of spatial scales.
      Version: '2'
      Code: '7788945'
    Desc: The data file contains an image pyramid
    Req: 'No'
    Type: string
  working_distance:
    Term:
    - Value: Imaging Procedure Microscope Device Working Distance Float Value
      Origin: caDSR
